name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web console + Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Type-check (console + Worker)
        run: npm run typecheck
      - name: Unit, integration and HTTP API tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: E2E — demo mode (static hosting)
        run: npm run test:e2e
      - name: E2E — server mode (Worker in workerd)
        run: npm run test:e2e:server

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Agent unit tests + release APKs
        working-directory: android
        run: ./gradlew --no-daemon :agent:testDebugUnitTest :agent:assembleRelease :console:assembleRelease
      - name: Agent ↔ server interop (real ApiClient against the Worker in workerd)
        run: android/scripts/interop.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mob-hunter-apks
          path: |
            android/agent/build/outputs/apk/release/*.apk
            android/console/build/outputs/apk/release/*.apk
          retention-days: 14

  desktop:
    name: Desktop agent (Windows, Linux, macOS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/desktop/go.mod
          cache-dependency-path: agents/desktop/go.sum
      - name: Vet (every OS) and unit tests
        working-directory: agents/desktop
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          for os in linux windows darwin; do GOOS=$os go vet ./...; done
          go test ./...
      - name: Agent ↔ server interop (real client against the Worker in workerd)
        run: agents/desktop/interop.sh
      - name: Cross-compile
        run: agents/desktop/build.sh desktop-out
      - name: Downloads index page renders from the published files
        run: cp releases/android/* desktop-out/ && node scripts/downloads-index.mjs desktop-out https://example.test && grep -q 'mob-hunter-agent-windows-amd64.exe' desktop-out/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: mob-hunter-desktop-agent
          path: desktop-out/
          retention-days: 14

  desktop-service:
    name: Desktop agent service on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/desktop/go.mod
          cache-dependency-path: agents/desktop/go.sum
      - name: Unit tests on this OS
        working-directory: agents/desktop
        run: go test ./...
      - name: Build the agent
        working-directory: agents/desktop
        shell: bash
        run: go build -o "$RUNNER_TEMP/mob-hunter-agent$([ "$RUNNER_OS" = Windows ] && echo .exe)" .
      - name: Real service end to end (install, run, inventory, commands, logs, release)
        shell: bash
        run: node e2e/desktop-service.mjs "$RUNNER_TEMP/mob-hunter-agent$([ "$RUNNER_OS" = Windows ] && echo .exe)"

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
