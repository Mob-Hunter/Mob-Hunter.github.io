name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SERVER_URL: ${{ vars.MOBHUNTER_SERVER_URL || 'https://mob-hunter.inbox-ashen.workers.dev' }}
  DOWNLOADS_URL: https://mob-hunter.github.io/downloads

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The end-to-end suite runs against the self-contained build first.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # The published site is the production landing page: it points at the live
      # server and offers the signed APKs over QR codes. No demo backend is published.
      - name: Production build
        run: npm run build
        env:
          VITE_SERVER_URL: ${{ env.SERVER_URL }}
          VITE_DOWNLOADS_URL: ${{ env.DOWNLOADS_URL }}
      - name: Check for the release signing key
        id: signing
        env:
          KS: ${{ secrets.MH_KEYSTORE_BASE64 }}
        run: echo "present=$([ -n "$KS" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.signing.outputs.present == 'true'
        uses: ./.github/actions/android-build
        with:
          server-url: ${{ env.SERVER_URL }}
          keystore-base64: ${{ secrets.MH_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.MH_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.MH_KEY_ALIAS }}
          key-password: ${{ secrets.MH_KEY_PASSWORD }}
      # Without the key, publish the release-signed APKs committed in releases/android.
      # Debug-signed APKs are never published.
      - if: steps.signing.outputs.present != 'true'
        run: mkdir -p apk-out && cp releases/android/* apk-out/ && (cd apk-out && sha256sum -c SHA256SUMS.txt)
      - name: Publish APKs with the site
        run: mkdir -p dist/downloads && cp apk-out/*.apk apk-out/SHA256SUMS.txt dist/downloads/
      - uses: actions/setup-go@v5
        with:
          go-version-file: agents/desktop/go.mod
      - name: Build and publish the desktop agent (Windows, Linux, macOS)
        run: agents/desktop/build.sh dist/downloads "$(grep -m1 'var Version' agents/desktop/main.go | cut -d'"' -f2)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
